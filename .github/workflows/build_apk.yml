name: R&MA Android CI

on:
  push:
    branches: [main, "rebuild/**"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build_apk.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid wasting runners on obsolete commits during rapid development pushes.
concurrency:
  group: rma-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Run Android Keystore and AtomicFile device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect merged debug manifest
        run: |
          set -euo pipefail
          manifest_path="app/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml"
          if [[ ! -s "$manifest_path" ]]; then
            manifest_path="$(find app/build/intermediates -type f -path '*merged_manifest*' -name 'AndroidManifest.xml' | sort | head -n 1)"
          fi
          if [[ -z "$manifest_path" || ! -s "$manifest_path" ]]; then
            echo "Merged debug AndroidManifest.xml was not found."
            find app/build/intermediates -type f -name 'AndroidManifest.xml' -print
            exit 1
          fi
          cp "$manifest_path" app/build/merged-debug-AndroidManifest.xml
          test -s app/build/merged-debug-AndroidManifest.xml
      - name: Upload merged debug manifest
        uses: actions/upload-artifact@v4
        with:
          name: RMA-merged-debug-manifest
          path: app/build/merged-debug-AndroidManifest.xml
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RMA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
