name: .github/workflows/build_apk.yml

on:
  push:
    branches: [ main ]
    paths:
      - 'RescueVPN-Android-Source.zip'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive
        run: |
          test -f RescueVPN-Android-Source.zip
          mkdir -p project
          unzip -q RescueVPN-Android-Source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Run unit tests
        working-directory: project
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rescue-VPN-AI-Debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
